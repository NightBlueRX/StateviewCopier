<style>

        color: #fff;

        margin: 0;

    }

        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #b8c3d6;
        margin-bottom: 25px;
    }

    .tabs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px auto 25px;
        max-width: 900px;
    }

    .tab {
        flex: 1;
        max-width: 250px;
        padding: 14px;
        background: #1b202b;
        border: 1px solid #38465d;
        color: #c6d2e5;
        font-size: 17px;
        border-radius: 8px;
    }

    .tab.active {
        background: #1687e8;
        border-color: #1687e8;
        color: white;
    }

    .panel {
        display: none;
        max-width: 900px;
        margin: auto;
    }

    .panel.active {
        display: block;
    }

    .panel h2 {
        color: #48aaff;
        margin-top: 0;
    }

    textarea {
        display: block;
        width: 100%;
        min-height: 100px;
        background: #1b202b;
        color: white;
        border: 1px solid #38465d;
        border-radius: 8px;
        padding: 12px;
        font-size: 15px;
        resize: vertical;
    }

    button {
        background: #1687e8;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
    }

    button:hover {
        background: #086bc0;
    }

    .generate {
        margin-top: 10px;
        width: 100%;
        padding: 13px;
        font-size: 16px;
    }

    .line {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #1b202b;
        border: 1px solid #303b4d;
        border-radius: 8px;
        padding: 13px;
        margin-bottom: 10px;
    }

    .line-text {
        flex: 1;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.5;
    }

    .copy-status {
        color: #70e6a1;
        font-size: 13px;
        min-height: 16px;
    }

    .count {
        color: #b8c3d6;
        font-size: 13px;
        margin: 12px 0;
    }

    @media (max-width: 600px) {
        body { padding: 12px; }

        .line {
            align-items: flex-start;
            flex-direction: column;
        }

        .line button { width: 100%; }
    }
</style>
</head>

<body>

<p class="subtitle">Made by Leadguitarhero. Last Update: 10/19/2026</p>

<div class="tabs">
    <button class="tab active" data-tab="shift">Shift</button>
    <button class="tab" data-tab="training">Training</button>
</div>

<!-- SHIFT TAB -->
<section id="shift" class="panel active">
    <h2>Shift Line Copier</h2>

    <textarea id="shiftInput"
        placeholder="Add your own shift lines here. Put each line on a separate line."></textarea>

    <button class="generate" onclick="addCustomLines('shift')">
        Generate Copy Buttons
    </button>

    <p id="shiftStatus" class="copy-status"></p>
    <p id="shiftCount" class="count"></p>
    <div id="shiftOutput"></div>
</section>

</section>

// Create a copyable row.
function createLine(tabName, text) {
    const output = document.getElementById(tabName + "Output");
    const row = document.createElement("div");
    row.className = "line";

    const lineText = document.createElement("div");
    lineText.className = "line-text";
    lineText.textContent = text;

    const copyButton = document.createElement("button");
    copyButton.textContent = "Copy";

    copyButton.addEventListener("click", async () => {
        try {
            await copyText(text);
            copyButton.textContent = "Copied!";
            setTimeout(() => copyButton.textContent = "Copy", 1200);
        } catch (error) {
            document.getElementById(tabName + "Status").textContent =
                "Copy failed. Try selecting the text and copying it manually.";
        }
    });

    row.appendChild(lineText);
    row.appendChild(copyButton);
    output.appendChild(row);

    updateCount(tabName);
}

// Copy text, with a fallback for local HTML files.
async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
    }

    const temporary = document.createElement("textarea");
    temporary.value = text;
    temporary.style.position = "fixed";
    temporary.style.left = "-9999px";
    document.body.appendChild(temporary);
    temporary.select();

    const successful = document.execCommand("copy");
    temporary.remove();

    if (!successful) throw new Error("Copy failed");
}

// Add custom lines without clearing existing lines.
function addCustomLines(tabName) {
    const input = document.getElementById(tabName + "Input");
    const status = document.getElementById(tabName + "Status");

    const lines = input.value
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0);

    if (lines.length === 0) {
        status.textContent = "Type one or more lines first.";
        return;
    }

    lines.forEach(line => createLine(tabName, line));

    input.value = "";
    status.textContent = `Added ${lines.length} custom line(s).`;
}

// Update the number of lines in each tab.
function updateCount(tabName) {
    const output = document.getElementById(tabName + "Output");
    document.getElementById(tabName + "Count").textContent =
        `${output.children.length} lines available`;
}

// Switch between Shift and Training.

    button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(tab =>
            tab.classList.remove("active")
        );

        document.querySelectorAll(".panel").forEach(panel =>
            panel.classList.remove("active")
        );

        button.classList.add("active");
        document.getElementById(button.dataset.tab).classList.add("active");
    });
});

// Load both sets of default lines.
